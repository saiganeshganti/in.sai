<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#f6f7fb; color:#111; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .card { background:#fff; padding:28px; border-radius:10px; box-shadow:0 6px 20px rgba(20,20,40,0.08); width:380px; }
    h1 { margin:0 0 12px 0; font-size:20px; }
    label { display:block; margin-top:12px; font-size:13px; color:#333; }
    input[type="text"], input[type="password"] { width:100%; padding:10px 12px; margin-top:6px; border:1px solid #d9dbe6; border-radius:6px; font-size:14px; }
    .row { display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
    .actions { margin-top:18px; display:flex; gap:8px; }
    button { padding:10px 14px; border-radius:8px; border:0; cursor:pointer; font-weight:600; }
    button.primary { background:#2563eb; color:#fff; }
    button.ghost { background:#eef2ff; color:#2563eb; }
    #login-error { color:#b91c1c; margin-top:12px; display:none; font-size:13px; white-space:pre-wrap; }
    .small { font-size:13px; color:#555; }
    .remember { display:flex; align-items:center; gap:8px; margin-top:10px; }
    a { color:#2563eb; text-decoration:none; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(0,0,0,0.08); border-top-color:#2563eb; border-radius:50%; animation:spin 1s linear infinite; vertical-align:middle; margin-left:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" role="main" aria-labelledby="login-heading">
    <h1 id="login-heading">Sign in</h1>

    <form id="login-form" autocomplete="off" novalidate>
      <label for="username">Email or username</label>
      <input id="username" name="username" type="text" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <div class="remember">
        <input id="remember" type="checkbox" />
        <label for="remember" class="small">Remember credentials</label>
      </div>

      <div class="actions">
        <button type="submit" class="primary" id="signin-btn">Sign in</button>
        <button type="button" id="logout-btn" class="ghost">Log out</button>
      </div>

      <div id="login-error" role="alert" aria-live="polite"></div>
    </form>

    <p class="small" style="margin-top:14px">Don't have an account? <a href="/signup.html">Sign up</a></p>
  </div>

  <script>
  /* ---------- Configuration ---------- */
  const APP_URL = '/talent-pool.html';
  const TOKEN_KEY = 'auth_token';
  const REMEMBER_KEY = 'remember_credentials';
  const SAVED_USER_KEY = 'saved_username';

  /* ---------- Utility helpers ---------- */
  function el(selector) { return document.querySelector(selector); }
  function showLoginError(msg) {
    const elErr = el('#login-error');
    if (elErr) {
      elErr.textContent = msg;
      elErr.style.display = 'block';
    } else {
      alert(msg);
    }
  }
  function clearLoginError() {
    const elErr = el('#login-error');
    if (elErr) {
      elErr.textContent = '';
      elErr.style.display = 'none';
    }
  }
  function setSigningIn(isSigning) {
    const btn = el('#signin-btn');
    if (!btn) return;
    btn.disabled = isSigning;
    if (isSigning) {
      btn.innerHTML = 'Signing in <span class="spinner" aria-hidden="true"></span>';
    } else {
      btn.innerHTML = 'Sign in';
    }
  }

  /* ---------- Robust callApi with retry/backoff and fallback ---------- */
  /**
   * callApi(path, options)
   * - Retries on network failures (TypeError) or AbortError (timeout)
   * - Retries up to 3 attempts with delays: 1500ms, 4000ms, 7000ms
   * - If a relative path fails with a network error, tries again using absolute origin + path
   * - Uses fetch options that reduce common CORS/credential issues:
   *     mode: 'cors', credentials: 'same-origin' (change to 'include' if server uses cookies)
   * - Returns parsed JSON or text on success; throws Error with .status for HTTP errors
   */
  async function callApi(path, options = {}) {
    const maxAttempts = 3;
    const backoffDelays = [1500, 4000, 7000]; // ms
    let attempt = 0;

    // Normalize options and defaults
    const baseOptions = Object.assign({
      method: 'GET',
      headers: {},
      mode: 'cors',               // allow cross-origin if server permits
      credentials: 'same-origin', // change to 'include' if your auth uses cookies
      timeoutMs: 10000            // default timeout
    }, options);

    // Helper to perform a single fetch attempt
    async function singleFetch(url, fetchOptions) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), fetchOptions.timeoutMs);
      try {
        const opts = Object.assign({}, fetchOptions, { signal: controller.signal });
        delete opts.timeoutMs; // not a fetch option
        const res = await fetch(url, opts);
        clearTimeout(timeoutId);

        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          const json = await res.json();
          if (!res.ok) {
            const err = new Error(json?.message || `Request failed with status ${res.status}`);
            err.status = res.status;
            err.body = json;
            throw err;
          }
          return json;
        } else {
          const text = await res.text();
          if (!res.ok) {
            const err = new Error(text || `Request failed with status ${res.status}`);
            err.status = res.status;
            err.body = text;
            throw err;
          }
          return text;
        }
      } catch (err) {
        clearTimeout(timeoutId);
        throw err;
      }
    }

    // Try relative path first, then fallback to absolute origin if network errors occur
    const originPrefixed = (() => {
      try {
        // If path is already absolute (starts with http), return as-is
        if (/^https?:\/\//i.test(path)) return path;
        // Otherwise prefix with current origin
        return window.location.origin.replace(/\/$/, '') + (path.startsWith('/') ? path : '/' + path);
      } catch (e) {
        return path;
      }
    })();

    while (true) {
      attempt++;
      const tryAbsolute = attempt > 1; // attempt 1: relative; attempt 2+: absolute origin-prefixed
      const urlToUse = tryAbsolute ? originPrefixed : path;

      try {
        return await singleFetch(urlToUse, baseOptions);
      } catch (err) {
        // Network/timeout/abort detection
        const isAbort = err && err.name === 'AbortError';
        const isTypeError = err instanceof TypeError;
        const isNetworkLike = isAbort || isTypeError;

        // If it's an HTTP error (we threw with .status), rethrow immediately (no retry)
        if (err && typeof err.status === 'number') {
          throw err;
        }

        // If it's a network-like error and we have attempts left, retry with backoff
        if (isNetworkLike && attempt < maxAttempts) {
          const delay = backoffDelays[Math.min(attempt - 1, backoffDelays.length - 1)];
          const jitter = Math.floor(Math.random() * 200);
          await new Promise(r => setTimeout(r, delay + jitter));
          // continue to next attempt (which will try absolute URL after first failure)
          continue;
        }

        // Exhausted retries or non-network error: attach helpful debug info and rethrow
        const debug = {
          message: err?.message || String(err),
          attempt,
          triedUrl: urlToUse,
          originPrefixed
        };
        const finalErr = new Error(`Network error: ${debug.message}`);
        finalErr.debug = debug;
        throw finalErr;
      }
    }
  }

  /* Convenience wrapper for POST JSON */
  async function postJson(path, body, opts = {}) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    const options = {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      timeoutMs: opts.timeoutMs || 10000,
      mode: opts.mode || undefined,
      credentials: opts.credentials || undefined
    };
    return await callApi(path, options);
  }

  /* ---------- Login / Remember credentials flow ---------- */
  function initLoginForm() {
    const savedUser = localStorage.getItem(SAVED_USER_KEY);
    const remember = localStorage.getItem(REMEMBER_KEY) === 'true';
    const userInput = el('#username');
    const rememberCheckbox = el('#remember');

    if (savedUser && userInput) userInput.value = savedUser;
    if (rememberCheckbox) rememberCheckbox.checked = remember;
  }

  function checkAutoRedirect() {
    const remember = localStorage.getItem(REMEMBER_KEY) === 'true';
    const token = localStorage.getItem(TOKEN_KEY);
    if (remember && token) {
      // Optionally validate token with a quick API call here
      window.location.href = APP_URL;
    }
  }

  async function handleSuccessfulLogin({ token, username, remember }) {
    if (!token) throw new Error('No token returned from login');

    if (remember) {
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(REMEMBER_KEY, 'true');
      localStorage.setItem(SAVED_USER_KEY, username || '');
      sessionStorage.removeItem(TOKEN_KEY);
    } else {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(REMEMBER_KEY);
      sessionStorage.setItem(TOKEN_KEY, token);
    }

    window.location.href = APP_URL;
  }

  function logoutAndReturnToLogin() {
    sessionStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(REMEMBER_KEY);
    // keep saved username for convenience; remove if you want a clean slate:
    // localStorage.removeItem(SAVED_USER_KEY);
    window.location.href = '/login.html';
  }

  async function onLoginSubmit(event) {
    event.preventDefault();
    clearLoginError();
    setSigningIn(true);

    const usernameEl = el('#username');
    const passwordEl = el('#password');
    const rememberEl = el('#remember');

    const username = usernameEl?.value?.trim() || '';
    const password = passwordEl?.value || '';
    const remember = !!(rememberEl && rememberEl.checked);

    if (!username || !password) {
      setSigningIn(false);
      showLoginError('Please enter both username and password.');
      return;
    }

    // If the browser is offline, show immediate message
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      setSigningIn(false);
      showLoginError('You appear to be offline. Check your network connection and try again.');
      return;
    }

    try {
      // If your backend expects a different path, change '/api/login' accordingly.
      const resp = await postJson('/api/login', { username, password }, { timeoutMs: 12000 });

      if (resp && resp.token) {
        await handleSuccessfulLogin({ token: resp.token, username, remember });
      } else {
        setSigningIn(false);
        showLoginError(resp?.message || 'Login failed. Check credentials.');
      }
    } catch (err) {
      setSigningIn(false);

      // If we have an HTTP status (e.g., 401), show friendly message
      if (err && err.status === 401) {
        showLoginError('Incorrect username or password.');
        return;
      }

      // If callApi attached debug info, show a concise hint and log full debug to console
      if (err && err.debug) {
        console.error('callApi debug:', err.debug);
        showLoginError('Network error: failed to reach the server. Try again. (See console for details.)');
        return;
      }

      // Generic fallback
      console.error('Auth error:', err);
      showLoginError(err?.message || 'Network error. Please try again.');
    }
  }

  /* ---------- Wire up events ---------- */
  document.addEventListener('DOMContentLoaded', () => {
    initLoginForm();
    checkAutoRedirect();

    const loginForm = el('#login-form');
    if (loginForm) loginForm.addEventListener('submit', onLoginSubmit);

    const logoutBtn = el('#logout-btn');
    if (logoutBtn) logoutBtn.addEventListener('click', logoutAndReturnToLogin);
  });

  /* Expose for other scripts if needed */
  window.appAuth = {
    callApi,
    postJson,
    logoutAndReturnToLogin
  };
  </script>
</body>
</html>
