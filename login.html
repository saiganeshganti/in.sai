<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — In SAI</title>
<link rel="stylesheet" href="/style.css">
<style>
body{cursor:default}
.auth-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:460px;padding:38px 38px 32px;border-radius:22px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.auth-card h1{margin:0 0 8px;font-size:28px;line-height:1.2}
.auth-card p.subtitle{margin:0 0 26px;font-size:15px;line-height:1.5;opacity:.72}
.auth-field{margin-bottom:18px}
.auth-field label{display:block;margin-bottom:7px;font-size:14px;font-weight:600}
.auth-field input[type=text],.auth-field input[type=email],.auth-field input[type=password]{width:100%;box-sizing:border-box;padding:13px 15px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);color:inherit;font-family:inherit;font-size:16px;outline:none;cursor:text}
.auth-field input::placeholder{opacity:.5}
.auth-field input:focus{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
.auth-field input.invalid{border-color:rgba(224,131,138,.75)}
.password-wrap{position:relative}
.password-wrap input{padding-right:48px!important}
.toggle-pass{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:inherit;opacity:.6;cursor:pointer;border-radius:8px}
.toggle-pass:hover,.toggle-pass:focus-visible{opacity:1;background:rgba(255,255,255,.08)}
.toggle-pass svg{width:20px;height:20px}
.field-error{margin-top:6px;font-size:13px;color:#e0838a;min-height:0}
.rules{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.rules li{opacity:.65;margin-bottom:3px}
.rules li:before{content:"○ "}
.rules li.ok{opacity:1;color:#7fd99a}
.rules li.ok:before{content:"✓ "}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-4px 0 14px;font-size:14px}
.remember{display:flex;align-items:center;gap:8px;cursor:pointer}
.remember input{width:16px;height:16px;cursor:pointer}
.link-button{background:none;border:none;text-decoration:underline;cursor:pointer;font:inherit;color:inherit;padding:0}
.auth-submit{width:100%;padding:15px 18px;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;margin-top:6px}
.auth-submit:disabled{opacity:.6;cursor:default}
.auth-toggle{margin-top:20px;text-align:center;font-size:14px;opacity:.85}
.auth-toggle button{background:none;border:none;text-decoration:underline;cursor:pointer;font:inherit;font-weight:700;color:inherit;padding:0}
.auth-status{margin-top:14px;font-size:14px;min-height:18px;line-height:1.45}
.auth-status.error{color:#e0838a}
.auth-status.success{color:#7fd99a}
.auth-status.info{opacity:.85}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;text-decoration:none;color:inherit;cursor:pointer}
.auth-brand img{display:block;width:190px;max-width:65%;height:auto;object-fit:contain}
.back-to-search{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;margin-top:22px;padding:13px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.035);font-size:15px;font-weight:600;text-decoration:none;color:inherit;cursor:pointer;transition:background .2s,border-color .2s}
.back-to-search:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.26)}
[hidden]{display:none!important}
@media(max-width:600px){.auth-card{padding:28px 22px 24px;border-radius:18px}.auth-card h1{font-size:25px}.auth-brand img{width:170px}}
</style>
</head>
<body>

<div class="background"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="grid"></div></div>

<div class="auth-wrapper">
<div class="auth-card">

<a class="auth-brand" href="/" title="Back to Search"><img src="/in-sai-logo.png" alt="In SAI"></a>

<h1 id="authTitle">Welcome back</h1>
<p class="subtitle" id="authSubtitle">Sign in to your In SAI recruiter account.</p>

<form id="authForm" novalidate>

<div class="auth-field" id="nameField" hidden>
<label for="nameInput">Your name</label>
<input id="nameInput" type="text" autocomplete="name" placeholder="Jane Recruiter">
<div class="field-error" id="nameError"></div>
</div>

<div class="auth-field" id="emailField">
<label for="emailInput">Email</label>
<input id="emailInput" type="email" autocomplete="email" placeholder="you@company.com">
<div class="field-error" id="emailError"></div>
</div>

<div class="auth-field" id="passwordField">
<label for="passwordInput" id="passwordLabel">Password</label>
<div class="password-wrap">
<input id="passwordInput" type="password" autocomplete="current-password" placeholder="Enter your password">
<button type="button" class="toggle-pass" data-target="passwordInput" aria-label="Show password"></button>
</div>
<div class="field-error" id="passwordError"></div>
<ul class="rules" id="rules" hidden>
<li id="ruleLength">At least 8 characters</li>
<li id="ruleMix">At least one letter and one number</li>
<li id="ruleCommon">Not a common password</li>
</ul>
</div>

<div class="auth-field" id="confirmField" hidden>
<label for="confirmInput">Confirm password</label>
<div class="password-wrap">
<input id="confirmInput" type="password" autocomplete="new-password" placeholder="Re-enter your password">
<button type="button" class="toggle-pass" data-target="confirmInput" aria-label="Show password"></button>
</div>
<div class="field-error" id="confirmError"></div>
</div>

<div class="row-between" id="loginExtras">
<label class="remember"><input type="checkbox" id="rememberInput"> Remember my email</label>
<button type="button" class="link-button" id="forgotButton">Forgot password?</button>
</div>

<button type="submit" class="auth-submit view-button" id="authSubmitButton">Sign In</button>

</form>

<div class="auth-status" id="authStatus" role="status" aria-live="polite"></div>

<div class="auth-toggle">
<span id="authToggleText">Don't have an account?</span>
<button type="button" id="authToggleButton">Create one</button>
</div>

<a class="back-to-search" href="/">← Back to Search</a>

</div>
</div>

<script>
const API_BASE_URL = "https://in-sai.onrender.com";
const AUTH_TOKEN_KEY = "insai_auth_token";
const REMEMBER_EMAIL_KEY = "insai_remembered_email";
const APP_URL = "/talent-pool.html";
const COMMON_PASSWORDS = ["password","password1","password123","12345678","123456789","1234567890","qwerty123","qwertyuiop","iloveyou","admin123","welcome1","welcome123","letmein123","abc12345","11111111","passw0rd","p@ssword","p@ssw0rd","1q2w3e4r"];

const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0112 19c-7 0-11-7-11-7a19.8 19.8 0 015.06-5.94M9.9 4.24A10.9 10.9 0 0112 4c7 0 11 7 11 7a19.9 19.9 0 01-3.17 4.19M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

const $ = id => document.getElementById(id);
const form = $("authForm"), nameInput = $("nameInput"), emailInput = $("emailInput"),
      passwordInput = $("passwordInput"), confirmInput = $("confirmInput"),
      rememberInput = $("rememberInput"), submitButton = $("authSubmitButton"),
      statusEl = $("authStatus");

let mode = "login";
let busy = false;
let lockTimer = null;
let resetToken = "";

/* ---------- helpers ---------- */

function showStatus(text, type) {
  statusEl.textContent = text || "";
  statusEl.className = "auth-status" + (type ? " " + type : "");
}

function setFieldError(field, message) {
  const el = $(field + "Error"), input = $(field + "Input");
  if (el) el.textContent = message || "";
  if (input) input.classList.toggle("invalid", !!message);
}

function clearErrors() {
  ["name", "email", "password", "confirm"].forEach(f => setFieldError(f, ""));
  showStatus("");
}

function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }

function passwordChecks(pw) {
  return {
    length: pw.length >= 8,
    mix: /[A-Za-z]/.test(pw) && /\d/.test(pw),
    common: pw.length > 0 && !COMMON_PASSWORDS.includes(pw.toLowerCase())
  };
}

function updateRules() {
  const c = passwordChecks(passwordInput.value);
  $("ruleLength").classList.toggle("ok", c.length);
  $("ruleMix").classList.toggle("ok", c.mix);
  $("ruleCommon").classList.toggle("ok", c.common);
}

function firstPasswordProblem(pw) {
  const c = passwordChecks(pw);
  if (!c.length) return "Password must be at least 8 characters.";
  if (!c.mix) return "Password must include at least one letter and one number.";
  if (!c.common) return "That password is too common. Please choose a less predictable one.";
  return "";
}

/* ---------- show / hide password ---------- */

document.querySelectorAll(".toggle-pass").forEach(btn => {
  btn.innerHTML = EYE;
  btn.addEventListener("click", () => {
    const input = $(btn.dataset.target);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.innerHTML = show ? EYE_OFF : EYE;
    btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    input.focus();
  });
});

/* ---------- modes ---------- */

function setMode(newMode) {
  mode = newMode;
  clearErrors();
  stopLockCountdown();
  passwordInput.value = "";
  confirmInput.value = "";
  passwordInput.type = confirmInput.type = "password";
  document.querySelectorAll(".toggle-pass").forEach(b => { b.innerHTML = EYE; b.setAttribute("aria-label", "Show password"); });

  const show = (id, on) => { $(id).hidden = !on; };
  const m = {
    login:    { title: "Welcome back", sub: "Sign in to your In SAI recruiter account.", btn: "Sign In", tText: "Don't have an account?", tBtn: "Create one", pLabel: "Password", pPlace: "Enter your password", auto: "current-password" },
    register: { title: "Create your account", sub: "Each recruiter gets their own login and their own sending email.", btn: "Create Account", tText: "Already have an account?", tBtn: "Sign in", pLabel: "Password", pPlace: "Choose a password", auto: "new-password" },
    forgot:   { title: "Reset your password", sub: "Enter your email and we'll send you a link to choose a new password.", btn: "Send Reset Link", tText: "Remembered it?", tBtn: "Back to sign in", pLabel: "Password", pPlace: "", auto: "current-password" },
    reset:    { title: "Choose a new password", sub: "Pick a new password for your account.", btn: "Reset Password", tText: "", tBtn: "Back to sign in", pLabel: "New password", pPlace: "Choose a new password", auto: "new-password" }
  }[mode];

  $("authTitle").textContent = m.title;
  $("authSubtitle").textContent = m.sub;
  submitButton.textContent = m.btn;
  $("authToggleText").textContent = m.tText;
  $("authToggleButton").textContent = m.tBtn;
  $("passwordLabel").textContent = m.pLabel;
  passwordInput.placeholder = m.pPlace;
  passwordInput.autocomplete = m.auto;

  show("nameField", mode === "register");
  show("emailField", mode !== "reset");
  show("passwordField", mode !== "forgot");
  show("confirmField", mode === "register" || mode === "reset");
  show("rules", mode === "register" || mode === "reset");
  show("loginExtras", mode === "login");
  updateRules();

  const first = mode === "register" ? nameInput : mode === "reset" ? passwordInput : emailInput;
  setTimeout(() => first.focus(), 0);
}

$("authToggleButton").addEventListener("click", () => {
  setMode(mode === "login" ? "register" : "login");
});
$("forgotButton").addEventListener("click", () => {
  const typed = emailInput.value;
  setMode("forgot");
  emailInput.value = typed;
});
passwordInput.addEventListener("input", () => { if (!$("rules").hidden) updateRules(); setFieldError("password", ""); });
[nameInput, emailInput, confirmInput].forEach(el => el.addEventListener("input", () => setFieldError(el.id.replace("Input", ""), "")));

/* ---------- lock countdown ---------- */

function stopLockCountdown() {
  if (lockTimer) { clearInterval(lockTimer); lockTimer = null; }
  if (!busy) submitButton.disabled = false;
}

function startLockCountdown(seconds) {
  stopLockCountdown();
  let left = Math.max(1, Math.round(seconds));
  const tick = () => {
    if (left <= 0) {
      stopLockCountdown();
      showStatus("You can try signing in again now.", "info");
      return;
    }
    const mm = String(Math.floor(left / 60)).padStart(2, "0"), ss = String(left % 60).padStart(2, "0");
    showStatus("Too many wrong attempts. Account locked — try again in " + mm + ":" + ss + ", or use “Forgot password?”.", "error");
    left -= 1;
  };
  submitButton.disabled = true;
  tick();
  lockTimer = setInterval(tick, 1000);
}

/* ---------- API ---------- */
/*
 * "TypeError: Failed to fetch" means the browser could not establish the
 * request at all (e.g. the Render backend was cold-starting or briefly
 * unreachable). This retries temporary network failures (TypeError /
 * AbortError) with increasing backoff before giving up, matching the
 * same retry behavior app.js already uses for Search/Talent Pool/Outreach.
 */
async function callApi(path, options, timeoutMs) {
  const effectiveTimeout = Number.isFinite(timeoutMs) ? timeoutMs : 90000;
  const maxAttempts = 3;
  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), effectiveTimeout);

    try {
      const response = await fetch(API_BASE_URL + path, {
        ...options,
        cache: "no-store",
        signal: controller.signal
      });
      clearTimeout(timer);
      return response;

    } catch (error) {
      clearTimeout(timer);
      lastError = error;

      const temporaryNetworkFailure =
        error && (error.name === "TypeError" || error.name === "AbortError");

      if (!temporaryNetworkFailure || attempt >= maxAttempts) {
        break;
      }

      const retryDelay = attempt === 1 ? 1500 : attempt === 2 ? 4000 : 7000;
      await new Promise(resolve => setTimeout(resolve, retryDelay));
    }
  }

  throw lastError || new Error("Request failed.");
}

function postJson(path, body) {
  return callApi(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}

/* ---------- submit ---------- */

form.addEventListener("submit", event => { event.preventDefault(); submitAuth(); });

async function submitAuth() {
  if (busy || submitButton.disabled) return;
  clearErrors();

  const name = nameInput.value.trim(), email = emailInput.value.trim(), password = passwordInput.value;

  // ----- client-side checks -----
  let ok = true;
  if (mode === "register" && !name) { setFieldError("name", "Please enter your name."); ok = false; }
  if (mode !== "reset") {
    if (!email) { setFieldError("email", "Please enter your email."); ok = false; }
    else if (!validEmail(email)) { setFieldError("email", "That doesn't look like a valid email."); ok = false; }
  }
  if (mode === "login" && !password) { setFieldError("password", "Please enter your password."); ok = false; }
  if (mode === "register" || mode === "reset") {
    const problem = firstPasswordProblem(password);
    if (problem) { setFieldError("password", problem); ok = false; }
    else if (confirmInput.value !== password) { setFieldError("confirm", "Passwords don't match."); ok = false; }
  }
  if (!ok) return;

  // ----- request -----
  busy = true;
  submitButton.disabled = true;
  const label = submitButton.textContent;
  submitButton.textContent = { login: "Signing in...", register: "Creating account...", forgot: "Sending...", reset: "Updating..." }[mode];
  const wakeTimer = setTimeout(() => showStatus("The server is waking up — the first request can take up to a minute. Please wait…", "info"), 4000);

  try {
    let path, payload;
    if (mode === "login") { path = "/auth/login"; payload = { email, password }; }
    else if (mode === "register") { path = "/auth/register"; payload = { name, email, password }; }
    else if (mode === "forgot") { path = "/auth/forgot-password"; payload = { email, page_url: location.origin + location.pathname }; }
    else { path = "/auth/reset-password"; payload = { token: resetToken, new_password: password }; }

    const response = await postJson(path, payload);
    const data = await response.json().catch(() => ({}));

    if (!response.ok || data.status !== "success") {
      if (data.locked) { startLockCountdown(data.retry_after_seconds || 900); return; }
      throw new Error(data.message || "Something went wrong. Please try again.");
    }

    if (mode === "forgot") { showStatus(data.message, "success"); return; }

    if (mode === "reset") {
      history.replaceState(null, "", location.pathname);
      resetToken = "";
      setMode("login");
      emailInput.value = localStorage.getItem(REMEMBER_EMAIL_KEY) || "";
      showStatus(data.message || "Password updated. You can now sign in.", "success");
      return;
    }

    if (mode === "login") {
      if (rememberInput.checked) localStorage.setItem(REMEMBER_EMAIL_KEY, email);
      else localStorage.removeItem(REMEMBER_EMAIL_KEY);
    }

    localStorage.setItem(AUTH_TOKEN_KEY, data.token);
    showStatus("✓ Success — redirecting...", "success");
    window.location.href = APP_URL;

  } catch (error) {
    console.error("Auth error:", error);
    if (error.name === "AbortError") showStatus("The server took too long to respond. Please try again.", "error");
    else if (error instanceof TypeError) showStatus("Could not reach the server. Check your internet connection and try again.", "error");
    else showStatus(error.message || "Something went wrong.", "error");
  } finally {
    clearTimeout(wakeTimer);
    busy = false;
    submitButton.textContent = label;
    if (!lockTimer) submitButton.disabled = false;
    if (statusEl.classList.contains("info") && statusEl.textContent.startsWith("The server is waking")) showStatus("");
  }
}

/* ---------- startup ---------- */

async function checkExistingSession() {
  const params = new URLSearchParams(location.search);

  if (params.get("expired")) {
    localStorage.removeItem(AUTH_TOKEN_KEY);
    history.replaceState(null, "", location.pathname);
    showStatus("Your session has expired. Please sign in again.", "info");
    return;
  }

  const token = localStorage.getItem(AUTH_TOKEN_KEY);
  if (!token) return;

  showStatus("Checking your session…", "info");
  try {
    const response = await callApi("/auth/me", { headers: { Authorization: "Bearer " + token } }, 60000);
    if (response.ok) { window.location.href = APP_URL; return; }
    if (response.status === 401) {
      localStorage.removeItem(AUTH_TOKEN_KEY);
      showStatus("Your session has expired. Please sign in again.", "info");
      return;
    }
  } catch (e) { /* fall through to the normal login form */ }
  showStatus("");
}

const savedEmail = localStorage.getItem(REMEMBER_EMAIL_KEY);
if (savedEmail) { emailInput.value = savedEmail; rememberInput.checked = true; }

const urlToken = new URLSearchParams(location.search).get("reset_token");
if (urlToken) {
  resetToken = urlToken;
  setMode("reset");
} else {
  setMode("login");
  checkExistingSession();
}
</script>

</body>
</html>
